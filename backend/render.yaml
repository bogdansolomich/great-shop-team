services:
  - name: server-setup-deploy
    type: web
    runtime: docker
    plan: free
    region: frankfurt
    branch: dev
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/
    # Deploy on every push to `dev`. This repo has no GitHub Actions deploy
    # hook, so Render's own git integration is the deploy trigger.
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: staging
      - key: DEBUG
        value: "false"
      - key: SECRET
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: SUPER_LOGIN
        sync: false
      - key: SUPER_PASSWORD
        sync: false

      # Known values for this deployment.
      - key: CORS_ALLOWED_ORIGINS
        value: https://wearly-shop-store.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://wearly-shop-store.vercel.app
      - key: DEFAULT_FROM_EMAIL
        value: noreply@example.com
